name: my_trekflow
description: "A Trekking App."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  curved_navigation_bar: ^1.0.6
  intl: ^0.19.0
  video_player: ^2.9.2
  sqflite: ^2.4.1
  path: ^1.9.0
  ffmpeg_kit_flutter: ^6.0.3
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  shared_preferences: ^2.3.3
  firebase_app_check: ^0.3.1+7
  
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_trekflow.jpg"
flutter:
  uses-material-design: true

  assets:
   - assets/slider/ 
   - assets/images/
   - assets/slider/video/
   - assets/slider/video/1.lunges.mp4
   - assets/hard/
   - assets/beginner/
   - assets/medium/